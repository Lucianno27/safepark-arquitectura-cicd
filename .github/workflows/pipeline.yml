# Nombre del pipeline que aparecerá en la sección Actions de GitHub.
name: Pipeline de CI/CD Corporativo - SafePark

# Define los eventos que activarán automáticamente el pipeline.
on:
  push:
    # Se activa para la rama main y las ramas feature/*.
    branches: [ main, "feature/*" ]

# Agrupa los trabajos (jobs) que ejecutará el pipeline secuencialmente.
jobs:

  # 1. Identificador del trabajo de construcción, pruebas y calidad.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de Código
        uses: actions/checkout@v3

      - name: Configurar Entorno Python/Django
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install django djangorestframework psycopg2-binary firebase-admin coverage

      - name: Pruebas Unitarias y de Integración
        run: coverage run manage.py test

      - name: Análisis Estático con SonarQube (Quality Gate)
        # Se ejecuta el análisis de calidad de código adaptado a Python
        run: sonar-scanner -Dsonar.projectKey=SafePark -Dsonar.sources=. -Dsonar.host.url=${{ secrets.SONAR_URL }}

  # 2. Identificador del trabajo de análisis de seguridad.
  security-scan:
    # Requiere que el trabajo anterior tenga éxito.
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de Código
        uses: actions/checkout@v3

      - name: Escaneo de Vulnerabilidades en Dependencias (Trivy)
        # Analiza el directorio buscando vulnerabilidades de seguridad
        run: trivy fs --security-checks config,vuln .

  # 3. Identificador del trabajo de empaquetado y despliegue.
  package-and-deploy:
    # Se ejecuta después de completar correctamente security-scan.
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de Código
        uses: actions/checkout@v3

      - name: Construir Imagen Docker
        # Construye la imagen utilizando el Dockerfile del proyecto Django
        run: docker build -t safepark/api:${{ github.sha }} .

      - name: Despliegue en Cluster (Staging / Producción)
        # Aplica la configuración de despliegue en el entorno destino
        run: kubectl apply -f k8s/deployment.yaml